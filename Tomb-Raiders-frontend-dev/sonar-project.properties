# 분석 제외 대상 (빌드 결과물, 의존성 등)
sonar.exclusions=**/node_modules/**, **/build/**, **/dist/**, **/coverage/**, public/

# 소스 경로 (보통 src)
sonar.sources=src

# 테스트 파일 제외 (분석 대상에서 빼고 싶을 때)
sonar.test.exclusions=src/**/*.test.js, src/**/*.test.jsx, src/**/*.spec.js, src/**/*.spec.jsx

# 테스트 파일은 중복 코드 품질 게이트 계산에서 제외
sonar.cpd.exclusions=src/**/*.test.js, src/**/*.test.jsx, src/**/*.spec.js, src/**/*.spec.jsx
